<!doctype html>
<html lang="it"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Inventario Tabaccheria</title>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
--bg:#f5f2ec;--card:#fff;--ink:#1e2924;--mut:#6a746e;--acc:#1f6f4a;--accink:#fff;--warn:#b45309;--warnbg:#fdf0dc;--bad:#b42318;--badbg:#fde8e6;--ok:#1f6f4a;--okbg:#e4f3ea;--bd:#e2dbcf}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){color-scheme:dark;--bg:#111613;--card:#1b231f;--ink:#e9efeb;--mut:#9aa6a0;--acc:#4cc38a;--accink:#07140d;--warn:#f0b35a;--warnbg:#3a2c14;--bad:#ff8a80;--badbg:#3d1f1c;--ok:#4cc38a;--okbg:#17301f;--bd:#2c3731}}
:root[data-theme="dark"]{color-scheme:dark;--bg:#111613;--card:#1b231f;--ink:#e9efeb;--mut:#9aa6a0;--acc:#4cc38a;--accink:#07140d;--warn:#f0b35a;--warnbg:#3a2c14;--bad:#ff8a80;--badbg:#3d1f1c;--ok:#4cc38a;--okbg:#17301f;--bd:#2c3731}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--bg);z-index:10}
header{position:sticky;top:env(safe-area-inset-top,0px);background:var(--bg);z-index:5;padding:12px 14px 0;border-bottom:1px solid var(--bd)}
h1{font-size:19px;margin:0 0 8px}
nav{display:flex;gap:4px}
nav button{flex:1;padding:10px 4px;border:0;background:none;color:var(--mut);font:inherit;font-weight:600;border-bottom:3px solid transparent;cursor:pointer}
nav button.on{color:var(--acc);border-color:var(--acc)}
main{max-width:720px;margin:0 auto;padding:14px}
.bar{display:flex;gap:8px;margin-bottom:10px;flex-wrap:wrap}
input,select,textarea{font:inherit;color:var(--ink);background:var(--card);border:1px solid var(--bd);border-radius:10px;padding:10px;min-width:0}
.bar input{flex:2 1 160px}.bar select{flex:1 1 120px}
button.btn{font:inherit;font-weight:600;padding:10px 14px;border-radius:10px;border:1px solid var(--bd);background:var(--card);color:var(--ink);cursor:pointer}
button.pri{background:var(--acc);color:var(--accink);border-color:var(--acc)}
button.dng{color:var(--bad)}
.sum{color:var(--mut);font-size:14px;margin:0 0 10px}
.row{display:flex;align-items:center;gap:8px;background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:10px;margin-bottom:8px}
.row.low{border-left:5px solid var(--warn)}.row.out{border-left:5px solid var(--bad)}
.info{flex:1;min-width:0}.info b{display:block;overflow-wrap:anywhere}
.info small{color:var(--mut)}
.tag{display:inline-block;font-size:12px;font-weight:700;border-radius:6px;padding:1px 7px;margin-left:6px}
.t-ok{background:var(--okbg);color:var(--ok)}.t-low{background:var(--warnbg);color:var(--warn)}.t-out{background:var(--badbg);color:var(--bad)}
.step{display:flex;align-items:center;gap:4px}
.step button{width:38px;height:38px;border-radius:10px;border:1px solid var(--bd);background:var(--bg);color:var(--ink);font-size:20px;cursor:pointer}
.step input{width:82px;text-align:center;padding:8px 2px}
.ed{border:0;background:none;color:var(--mut);font-size:18px;cursor:pointer;padding:6px}
h3{margin:16px 0 6px;font-size:14px;color:var(--mut);text-transform:uppercase;letter-spacing:.04em}
.empty{text-align:center;color:var(--mut);padding:30px 10px}
textarea{width:100%;min-height:150px;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:13px;margin-top:10px}
.ov{position:fixed;inset:0;background:rgba(0,0,0,.5);display:none;align-items:flex-end;justify-content:center;z-index:20}
.ov.on{display:flex}
.dlg{background:var(--bg);width:100%;max-width:520px;border-radius:16px 16px 0 0;padding:16px;max-height:92%;overflow:auto}
.dlg label{display:block;font-size:13px;color:var(--mut);margin:10px 0 3px}
.dlg input,.dlg select{width:100%}
.g3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.acts{display:flex;gap:8px;margin-top:16px;flex-wrap:wrap}.acts .btn{flex:1}
#toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:20px;font-size:14px;opacity:0;transition:opacity .2s;pointer-events:none;z-index:30}
#toast.on{opacity:1}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:16px;margin-bottom:12px}.card h2{margin:6px 0;font-size:22px;overflow-wrap:anywhere}.card small{color:var(--mut)}.btn.big{padding:18px 10px;font-size:18px}.chips{display:flex;gap:8px;flex-wrap:wrap;margin:8px 0}.chip{border:1px solid var(--bd);border-radius:20px;padding:6px 12px;background:var(--bg)}.bar2{height:8px;background:var(--bd);border-radius:4px;overflow:hidden;margin-bottom:12px}.bar2 i{display:block;height:100%;background:var(--acc)}.center{justify-content:center;margin:12px 0}.qk{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:8px;margin:14px 0}button:disabled{opacity:.45}
a.btn{text-decoration:none;display:inline-block;text-align:center}
</style><script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
</head><body>
<header><h1>🚬 Inventario Tabaccheria</h1>
<nav><button data-tab="ord">Ordine</button><button data-tab="inv">Inventario</button><button data-tab="dat">Dati</button></nav></header>
<main id="view"></main>
<div class="ov" id="ov"><div class="dlg" id="dlg"></div></div>
<div id="toast"></div>
<script>
const K="tabaccheria_v1";
const CATS=["Sigarette","Tabacco da rollare","Cartine e filtri","Sigari","Accendini","Gratta e Vinci","Ricariche","Valori bollati","Altro"];
const S={items:[],tab:"ord",q:"",cat:"",ord:{},wz:{started:false,list:[],i:0,ans:{},done:false,pick:null,cats:null}};
const $=s=>document.querySelector(s);
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
function load(){try{const r=localStorage.getItem(K);if(r)S.items=JSON.parse(r)}catch(e){}}
const DB_URL="";
let DB="";try{DB=localStorage.getItem(K+"_db")||""}catch(e){}DB=DB||DB_URL;
let ts=0,ready=false,ph=null;try{ts=+localStorage.getItem(K+"_ts")||0}catch(e){}
const dbu=()=>DB.trim().replace(/\/+$/,"").replace(/\.json$/,"")+"/tabaccheria.json";
function saveL(){try{localStorage.setItem(K,JSON.stringify(S.items))}catch(e){}}
function save(){saveL();push()}
function push(){ts=Date.now();try{localStorage.setItem(K+"_ts",ts)}catch(e){}clearTimeout(ph);ph=setTimeout(doPush,700)}
async function doPush(){if(!DB||!ready)return;try{await fetch(dbu(),{method:"PUT",body:JSON.stringify({t:ts,items:S.items})});sync("Sincronizzato")}catch(e){sync("Offline: riprovo")}}
function sync(m){const e=$("#syn");if(e)e.textContent=m}
async function pull(){
  if(!DB){ready=true;return}
  try{const d=await(await fetch(dbu())).json();ready=true;
    if(!d){ts=ts||Date.now();doPush()}
    else if(d.t>ts&&Array.isArray(d.items)){
      if(document.activeElement&&/INPUT|TEXTAREA|SELECT/.test(document.activeElement.tagName)||$("#ov").classList.contains("on"))return;
      S.items=d.items;ts=d.t;try{localStorage.setItem(K+"_ts",ts)}catch(e){}saveL();render();sync("Aggiornato")}
    else if(d.t<ts)doPush();else sync("Sincronizzato")
  }catch(e){sync("Offline: riprovo")}
}
function toast(m){const t=$("#toast");t.textContent=m;t.classList.add("on");clearTimeout(toast.h);toast.h=setTimeout(()=>t.classList.remove("on"),1800)}
const status=i=>i.q<=0?"out":(i.m>0&&i.q<=i.m?"low":"ok");
const target=i=>i.t>0?i.t:i.m*2;
const need=i=>S.ord[i.id]!==undefined?S.ord[i.id]:Math.max(0,sub(target(i)-i.q));
const sub=n=>Math.round(n*1000)/1000;const num=v=>Math.max(0,sub(parseFloat(String(v).replace(",","."))||0));const fm=n=>sub(n).toFixed(3).replace(".",",");const UL={stecca:["stecca","stecche"],pacco:["pacco","pacchi"]};const un=(i,v)=>{if(!i.u||!UL[i.un])return"";const n=Math.round(v/i.u*100)/100;return String(n).replace(".",",")+" "+UL[i.un][n===1?0:1]};

function render(){
  document.querySelectorAll("nav button").forEach(b=>b.classList.toggle("on",b.dataset.tab===S.tab));
  if(S.tab==="inv")renderInv();else if(S.tab==="ord")renderOrd();else renderDat();
}
function renderInv(){
  $("#view").innerHTML=`<div class="bar"><input id="q" type="search" placeholder="Cerca nome o scansiona codice…" value="${esc(S.q)}" autocomplete="off">
  <select id="cat"><option value="">Tutte le categorie</option>${CATS.map(c=>`<option ${S.cat===c?"selected":""}>${c}</option>`).join("")}</select>
  <button class="btn pri" data-act="new">+ Prodotto</button></div><p class="sum" id="sum"></p><div id="list"></div>`;
  $("#q").oninput=e=>{S.q=e.target.value;renderList()};
  $("#q").onkeydown=e=>{if(e.key!=="Enter")return;const v=S.q.trim();if(!v)return;
    const it=S.items.find(i=>i.b&&i.b===v);
    if(it){it.q=sub(it.q+(it.u||0.1));save();toast(`${it.n}: ${fm(it.q)} Kgc`);S.q="";$("#q").value="";renderList()}
    else if(/^\d{6,}$/.test(v)){openDlg(null,v)}};
  $("#cat").onchange=e=>{S.cat=e.target.value;renderList()};
  renderList();
}
function renderList(){
  const q=S.q.trim().toLowerCase();
  const L=S.items.filter(i=>(!S.cat||i.c===S.cat)&&(!q||i.n.toLowerCase().includes(q)||(i.b||"").includes(q)))
    .sort((a,b)=>a.c.localeCompare(b.c)||a.n.localeCompare(b.n));
  const low=S.items.filter(i=>status(i)!=="ok").length;
  $("#sum").textContent=`${S.items.length} prodotti · ${low} da riordinare`;
  $("#list").innerHTML=L.length?L.map(i=>{const s=status(i);
    return `<div class="row ${s==="ok"?"":s}" data-id="${i.id}"><div class="info"><b>${esc(i.n)}<span class="tag t-${s}">${s==="out"?"Esaurito":s==="low"?"Sotto scorta":"OK"}</span></b><small>${esc(i.c)}${i.b?" · "+esc(i.b):""} · min ${fm(i.m)}${i.u?" · "+un(i,i.q):""}</small></div>
    <div class="step"><button data-act="dec" aria-label="Meno">−</button><input type="text" inputmode="decimal" value="${fm(i.q)}" data-act="set"><button data-act="inc" aria-label="Più">+</button></div>
    <button class="ed" data-act="edit" aria-label="Modifica">✎</button><button class="ed" data-act="rmv" aria-label="Elimina">🗑</button></div>`}).join(""):
    `<div class="empty">${S.items.length?"Nessun risultato.":"Nessun prodotto. Aggiungine uno oppure carica l’esempio dalla scheda Dati."}</div>`;
}
function wsave(){try{localStorage.setItem(K+"_wz",JSON.stringify(S.wz))}catch(e){}}
const wL=()=>S.wz.list.map(id=>S.items.find(x=>x.id===id)).filter(Boolean);
const orderItems=()=>wL().filter(i=>S.wz.ans[i.id]>0);
const wline=i=>i.n+": "+fm(S.wz.ans[i.id])+" Kgc"+(i.u?" ("+un(i,S.wz.ans[i.id])+")":"");
function orderText(){const L=orderItems();let t="Ordine tabaccheria del "+new Date().toLocaleDateString("it-IT")+"\n",c="";L.forEach(i=>{if(i.c!==c){c=i.c;t+="\n"+c.toUpperCase()+"\n"}t+="- "+wline(i)+"\n"});return L.length?t:""}
function renderOrd(){
  const w=S.wz,v=$("#view"),L=wL();
  if(!w.started){
    const cs=CATS.filter(c=>S.items.some(i=>i.c===c)),sel=w.cats||cs,n=S.items.filter(i=>sel.includes(i.c)).length;
    v.innerHTML=`<div class="card"><h2>Ordine Logista</h2><p class="sum">Ti mostro un prodotto alla volta e rispondi se serve o no. Alla fine ottieni l’Excel da inviare.</p><div class="chips">${cs.map(c=>`<label class="chip"><input type="checkbox" data-wzc="${esc(c)}" ${sel.includes(c)?"checked":""}> ${esc(c)}</label>`).join("")}</div><p class="sum">${n} prodotti da controllare</p><div class="acts"><button class="btn pri" data-wz="start" ${n?"":"disabled"}>${L.length?"Ricomincia":"Inizia"}</button>${L.length?`<button class="btn" data-wz="resume">Riprendi</button>`:""}</div></div>`;return}
  if(w.done||w.i>=L.length){
    const O=orderItems(),tot=sub(O.reduce((s,i)=>s+w.ans[i.id],0));
    v.innerHTML=`<div class="card"><h2>Riepilogo</h2><p class="sum">${O.length} prodotti · totale ${fm(tot)} Kgc</p></div>`+
    (O.length?O.map(i=>`<div class="row"><div class="info"><b>${esc(i.n)}</b><small>${fm(w.ans[i.id])} Kgc${i.u?" · "+un(i,w.ans[i.id]):""}</small></div><button class="ed" data-wz="rm" data-id="${i.id}" aria-label="Togli">✕</button></div>`).join(""):`<div class="empty">Nessun prodotto selezionato.</div>`)+
    `<textarea id="out" readonly style="min-height:90px">${esc(orderText())}</textarea><div class="acts"><button class="btn pri" data-wz="xls">Scarica Excel</button><button class="btn pri" data-wz="pdf">Scarica PDF</button><button class="btn" data-wz="copy">Copia testo</button><button class="btn" data-wz="tab">Copia tabella</button></div><div class="acts"><button class="btn" data-wz="cont">← Torna al controllo</button><button class="btn" data-wz="exit">Ricomincia</button></div>`;return}
  const it=L[w.i],yes=Object.values(w.ans).filter(x=>x>0).length,head=`<p class="sum">${w.i+1} di ${L.length} · da ordinare: ${yes}</p><div class="bar2"><i style="width:${w.i/L.length*100}%"></i></div>`;
  if(w.pick!==null){
    v.innerHTML=head+`<div class="card"><small>${esc(it.c)}</small><h2>${esc(it.n)}</h2><p class="sum">Quanti Kgc ne ordini?</p><div class="step center"><button data-wz="dec" aria-label="Meno">−</button><input id="wq" data-wzq type="text" inputmode="decimal" value="${fm(w.pick)}"><button data-wz="inc" aria-label="Più">+</button></div><p class="sum" style="text-align:center">${un(it,w.pick)}</p>${it.u?`<div class="chips center">${[1,2,3,5,10].map(n=>`<button class="btn" data-wz="set" data-n="${sub(n*it.u)}">${n} ${UL[it.un][n===1?0:1]}</button>`).join("")}</div>`:""}<div class="acts"><button class="btn pri big" data-wz="ok">Conferma</button><button class="btn big" data-wz="cancel">Annulla</button></div></div>`;return}
  const a=w.ans[it.id];
  v.innerHTML=head+`<div class="card"><small>${esc(it.c)}${it.b?" · "+esc(it.b):""}</small><h2>${esc(it.n)}</h2><p class="sum">Giacenza segnata: ${fm(it.q)} Kgc${it.u?" · "+un(it,it.q):""}${a!==undefined?" · risposta: "+(a>0?fm(a)+" Kgc":"non serve"):""}</p><div class="qk">${(it.u?[1,2,3,5,10].map(n=>[sub(n*it.u),n+" "+UL[it.un][n===1?0:1]]):[0.1,0.2,0.3,0.5,1].map(n=>[n,fm(n)+" Kgc"])).map(x=>`<button class="btn pri big" data-wz="q" data-n="${x[0]}">${x[1]}</button>`).join("")}</div><div class="acts"><button class="btn big" data-wz="no">Non serve</button><button class="btn" data-wz="yes">Altra quantità</button></div></div><div class="acts"><button class="btn" data-wz="back" ${w.i?"":"disabled"}>← Indietro</button><button class="btn" data-wz="sum">Riepilogo</button><button class="btn" data-wz="exit">Esci</button></div>`;
}
async function saveFile(fn,data){
  let dl=null;try{dl=await claude.use("downloads")}catch(e){}
  if(dl)await dl.save({filename:fn,data});
  else{const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([data],{type:"application/octet-stream"}));a.download=fn;document.body.appendChild(a);a.click();a.remove()}
}
async function pdf(){
  const O=orderItems();if(!O.length){toast("Nessun prodotto da ordinare");return}
  if(!window.jspdf){toast("Libreria PDF non caricata");return}
  const d=new window.jspdf.jsPDF({unit:"mm",format:"a4"}),W=210,m=15,A=S.wz.ans,tot=sub(O.reduce((s,i)=>s+A[i.id],0));
  let y=0;
  const head=()=>{d.setFont("helvetica","bold");d.setFontSize(16);d.text("Ordine Logista",m,18);d.setFont("helvetica","normal");d.setFontSize(10);d.text("Data: "+new Date().toLocaleDateString("it-IT"),W-m,18,{align:"right"});
    d.setFont("helvetica","bold");d.setFontSize(9);d.text("Riga",m,28);d.text("Cod.AAMS",m+12,28);d.text("Descrizione",m+34,28);d.text("Confezioni",W-m-26,28,{align:"right"});d.text("Kgc",W-m,28,{align:"right"});d.line(m,30,W-m,30);d.setFont("helvetica","normal");y=36};
  head();
  O.forEach((i,k)=>{if(y>278){d.addPage();head()}
    d.setFontSize(9);d.text(String(k+1),m,y);d.text(i.b.replace(/^0+(?=\d)/,""),m+12,y);d.text(d.splitTextToSize(i.n,88)[0],m+34,y);
    d.text(un(i,A[i.id]),W-m-26,y,{align:"right"});d.text(fm(A[i.id]),W-m,y,{align:"right"});y+=6});
  d.line(m,y-3,W-m,y-3);d.setFont("helvetica","bold");d.text("Totale",m+34,y+3);d.text(fm(tot),W-m,y+3,{align:"right"});
  const n=d.getNumberOfPages();d.setFont("helvetica","normal");d.setFontSize(8);
  for(let p=1;p<=n;p++){d.setPage(p);d.text("Pagina "+p+" di "+n,W/2,290,{align:"center"})}
  try{await saveFile("Ordine_Logista_"+new Date().toISOString().slice(0,10)+".pdf",d.output("arraybuffer"));toast("PDF pronto")}
  catch(e){toast(e&&e.code==="declined"?"Annullato":"Non riuscito")}
}
async function xls(){
  const O=orderItems();if(!O.length){toast("Nessun prodotto da ordinare");return}
  if(typeof XLSX==="undefined"){toast("Libreria Excel non caricata");return}
  let dl=null;try{dl=await claude.use("downloads")}catch(e){}
  const rows=[["Codice AAMS","Quantita"]];
  O.forEach(i=>rows.push([/^\d+$/.test(i.b)?Number(i.b):i.b,sub(S.wz.ans[i.id])]));
  
  const ws=XLSX.utils.aoa_to_sheet(rows);ws["!cols"]=[{wch:12},{wch:9}];
  for(let r=1;r<rows.length;r++){const c=ws["B"+(r+1)];if(c)c.z="General"}
  const wb=XLSX.utils.book_new();XLSX.utils.book_append_sheet(wb,ws,"Sheet1");
  try{const fn="Ordine_Logista_"+new Date().toISOString().slice(0,10)+".xlsx",data=XLSX.write(wb,{bookType:"xlsx",type:"array"});if(dl)await dl.save({filename:fn,data});else{const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([data],{type:"application/octet-stream"}));a.download=fn;document.body.appendChild(a);a.click();a.remove()}toast("Excel pronto")}
  catch(e){toast(e&&e.code==="declined"?"Annullato":"Non riuscito: usa Copia tabella")}
}
document.addEventListener("click",e=>{
  const b=e.target.closest("[data-wz]");if(!b)return;const w=S.wz,a=b.dataset.wz,L=wL(),cur=()=>L[w.i];
  const next=()=>{w.pick=null;w.i++;if(w.i>=L.length)w.done=true;wsave();renderOrd()};
  const st=cur()&&(cur().u||0.1);
  if(a==="start"){const cs=w.cats;w.list=S.items.filter(i=>!cs||cs.includes(i.c)).sort((x,y)=>CATS.indexOf(x.c)-CATS.indexOf(y.c)||x.n.localeCompare(y.n)).map(i=>i.id);w.ans={};w.i=0;w.done=false;w.pick=null;w.started=true;wsave();renderOrd()}
  else if(a==="resume"){w.started=true;wsave();renderOrd()}
  else if(a==="exit"){w.started=false;w.pick=null;wsave();renderOrd()}
  else if(a==="no"){w.ans[cur().id]=0;next()}
  else if(a==="q"){w.ans[cur().id]=num(b.dataset.n);next()}
  else if(a==="yes"){w.pick=w.ans[cur().id]>0?w.ans[cur().id]:st;renderOrd()}
  else if(a==="inc"){w.pick=sub(num($("#wq").value)+st);renderOrd()}
  else if(a==="dec"){w.pick=Math.max(0,sub(num($("#wq").value)-st));renderOrd()}
  else if(a==="set"){w.pick=num(b.dataset.n);renderOrd()}
  else if(a==="cancel"){w.pick=null;renderOrd()}
  else if(a==="ok"){w.ans[cur().id]=num($("#wq").value);next()}
  else if(a==="back"){w.pick=null;w.i=Math.max(0,w.i-1);w.done=false;wsave();renderOrd()}
  else if(a==="sum"){w.done=true;w.pick=null;wsave();renderOrd()}
  else if(a==="cont"){w.done=false;if(w.i>=L.length)w.i=Math.max(0,L.length-1);wsave();renderOrd()}
